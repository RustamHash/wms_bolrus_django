api:
  dashboard: false

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

certificatesResolvers:
  le:
    acme:
      email: admin@bolrus.ru
      storage: /acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
