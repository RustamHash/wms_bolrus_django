{% extends "base.html" %}
{% load wms %}
{% block title %}Главная{% endblock %}
{% block content %}
<h1>Склад</h1>
<div class="cards">
  <div class="stat"><span>Открытые заказы</span><b>{{ orders }}</b></div>

</div>
{% endblock %}
