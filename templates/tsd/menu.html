{% extends "tsd_base.html" %}
{% load wms %}
{% block content %}
<h1>Меню</h1>
<p class="hint">Нажмите цифру на клавиатуре или кнопку на экране.</p>
<nav class="digit-menu">
  {% for item in items %}
  <a class="btn menu" data-digit="{{ item.digit }}" href="{{ item.href }}"><span class="digit">{{ item.digit }}</span>{{ item.title }}</a>
  {% empty %}
  <p>Нет доступных операций.</p>
  {% endfor %}
</nav>
{% endblock %}
