{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="shift-page">
<div class="page-bar">
  <div class="page-bar-row">
    <h1>Смена</h1>
  </div>
  <div class="page-tools">
    <form class="doc-filter" method="get" action="/shift">
      <div class="filter-row wrap">
        <span class="shift-presets">
          <a class="btn slim{% if preset == 'yesterday' %} on{% endif %}" href="/shift?date_from={{ yesterday|date:'Y-m-d' }}&date_to={{ yesterday|date:'Y-m-d' }}">Вчера</a>
          <a class="btn slim{% if preset == 'today' %} on{% endif %}" href="/shift?date_from={{ today|date:'Y-m-d' }}&date_to={{ today|date:'Y-m-d' }}">Сегодня</a>
          <a class="btn slim{% if preset == 'tomorrow' %} on{% endif %}" href="/shift?date_from={{ tomorrow|date:'Y-m-d' }}&date_to={{ tomorrow|date:'Y-m-d' }}">Завтра</a>
        </span>
        <label>Период
          <span class="dates">
            <input type="date" name="date_from" value="{{ date_from|date:'Y-m-d' }}">
            <span class="sep">—</span>
            <input type="date" name="date_to" value="{{ date_to|date:'Y-m-d' }}">
          </span>
        </label>
        <button class="slim">Показать</button>
      </div>
    </form>
  </div>
</div>

<div class="shift-board" id="shift-board">
  {% include "logistics/_shift_orders.html" %}
  {% include "logistics/_shift_incoming.html" %}
  {% include "logistics/_shift_routes.html" %}
</div>
</div>
<script>
(function () {
  const board = document.getElementById("shift-board");
  if (!board) return;
  board.addEventListener("click", async (event) => {
    const button = event.target.closest("[data-shift-refresh]");
    if (!button) return;
    const pane = button.closest(".shift-pane");
    const scroll = pane.querySelector(".shift-scroll");
    const top = scroll.scrollTop;
    const left = scroll.scrollLeft;
    const url = new URL(window.location.href);
    url.searchParams.set("part", pane.dataset.part);
    button.disabled = true;
    try {
      const response = await fetch(url, { headers: { "X-Requested-With": "fetch" } });
      const html = await response.text();
      if (!response.ok || !html.includes("data-part")) return;
      const next = new DOMParser().parseFromString(html, "text/html").querySelector(".shift-pane");
      if (!next) return;
      pane.replaceWith(next);
      const nextScroll = next.querySelector(".shift-scroll");
      if (nextScroll) {
        nextScroll.scrollTop = top;
        nextScroll.scrollLeft = left;
      }
    } finally {
      if (button.isConnected) button.disabled = false;
    }
  });
})();
</script>
{% endblock %}
