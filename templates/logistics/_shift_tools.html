<div class="shift-head">
  <h2>{{ heading }}</h2>
  <div class="actions">
    <a class="btn slim" href="/shift/{{ part }}/print?date_from={{ date_from|date:'Y-m-d' }}&date_to={{ date_to|date:'Y-m-d' }}" target="_blank">Печать</a>
    <button type="button" class="icon-btn" data-shift-refresh data-tip="Обновить" aria-label="Обновить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</div>
