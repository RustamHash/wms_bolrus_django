<div data-place>
  <label>Ячейка
    <span class="client-pick" data-cell-pick>
      <input type="hidden" name="cell_id" value="{{ selected_cell_id|default:'' }}" data-cell-id>
      <input type="text" data-cell-query autocomplete="off" autocorrect="off" spellcheck="false" placeholder="А-01" enterkeyhint="search">
      <ul data-cell-list hidden>
        {% for cell in warehouse_cells %}
        <li><button type="button" data-id="{{ cell.id }}" data-code="{{ cell.code }}" data-barcode="{{ cell.barcode }}" data-label="{{ cell.label }}" data-search="{{ cell.zone.code }} {{ cell.code }} {{ cell.label }} {{ cell.name }} {{ cell.barcode }}">{{ cell.label }}</button></li>
        {% endfor %}
      </ul>
    </span>
  </label>
  {% if not warehouse_cells %}
  <p class="hint">Справочник пуст. Сначала заведите <a href="/masters/warehouse-zones">зону</a> и <a href="/masters/warehouse-cells">место</a>: вместе они дают адрес вроде А-01.</p>
  {% endif %}
<script>
(function () {
  var root = document.currentScript.parentElement;
  if (!root || root.dataset.bound) return;
  root.dataset.bound = "1";
  var hidden = root.querySelector("[data-cell-id]");
  var query = root.querySelector("[data-cell-query]");
  var list = root.querySelector("[data-cell-list]");
  var buttons = list ? Array.prototype.slice.call(list.querySelectorAll("button")) : [];
  function norm(value) { return (value || "").replace(/[\u0000-\u001f]/g, "").trim().toLowerCase(); }
  function compact(value) { return norm(value).replace(/[-\s·.:]/g, ""); }
  function same(button, raw) {
    var key = norm(raw);
    var folded = compact(raw);
    if (!key) return false;
    return norm(button.dataset.barcode) === key
      || norm(button.dataset.code) === key
      || norm(button.dataset.label) === key
      || compact(button.dataset.label) === folded
      || compact(button.dataset.code) === folded;
  }
  function exact(raw) {
    if (!norm(raw)) return null;
    var found = buttons.filter(function (button) { return same(button, raw); });
    return found.length === 1 ? found[0] : null;
  }
  function choose(button) {
    if (!button) return;
    hidden.value = button.dataset.id;
    query.value = (button.dataset.label || button.textContent).trim();
    list.hidden = true;
  }
  function ranked(raw) {
    var needle = norm(raw);
    var folded = compact(raw);
    if (!needle) return [];
    return buttons.filter(function (button) {
      var search = norm((button.dataset.search || "") + " " + button.textContent);
      var foldedSearch = compact(search);
      var code = compact(button.dataset.code || "");
      var label = compact(button.dataset.label || "");
      return search.indexOf(needle) !== -1
        || foldedSearch.indexOf(folded) !== -1
        || code.indexOf(folded) === 0
        || label.indexOf(folded) === 0;
    }).sort(function (left, right) {
      function rank(button) {
        var code = compact(button.dataset.code || "");
        var label = compact(button.dataset.label || "");
        if (code === folded || label === folded || norm(button.dataset.barcode) === needle) return 0;
        if (code.indexOf(folded) === 0 || label.indexOf(folded) === 0) return 1;
        return 2;
      }
      return rank(left) - rank(right);
    });
  }
  function paint() {
    var found = ranked(query.value);
    var ids = {};
    found.forEach(function (button) { ids[button.dataset.id] = true; });
    buttons.forEach(function (button) {
      button.parentElement.hidden = !ids[button.dataset.id];
      button.classList.remove("mark");
    });
    if (found[0]) found[0].classList.add("mark");
    list.hidden = found.length === 0;
    if (found.length) list.scrollIntoView({ block: "nearest" });
    return found;
  }
  if (!query) return;
  var current = buttons.filter(function (button) { return button.dataset.id === hidden.value; })[0];
  if (current) query.value = current.dataset.label;
  query.addEventListener("focus", paint);
  query.addEventListener("input", function () {
    var current = buttons.filter(function (button) { return button.dataset.id === hidden.value; })[0];
    if (!current || norm(query.value) !== norm(current.dataset.label)) hidden.value = "";
    paint();
  });
  query.addEventListener("keyup", function (event) {
    if (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter" || event.key === "Escape") return;
    paint();
  });
  query.addEventListener("keydown", function (event) {
    var visible = buttons.filter(function (button) { return !button.parentElement.hidden; });
    var index = visible.findIndex(function (button) { return button.classList.contains("mark"); });
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      if (list.hidden) paint();
      visible = buttons.filter(function (button) { return !button.parentElement.hidden; });
      var next = visible[index + (event.key === "ArrowDown" ? 1 : -1)] || visible[0];
      if (!next) return;
      visible.forEach(function (button) { button.classList.remove("mark"); });
      next.classList.add("mark");
      next.scrollIntoView({ block: "nearest" });
    }
    if (event.key === "Enter") {
      var hit = exact(query.value);
      var marked = visible.filter(function (button) { return button.classList.contains("mark"); })[0];
      if (hit || (!list.hidden && marked)) {
        event.preventDefault();
        choose(hit || marked);
      }
    }
    if (event.key === "Escape") list.hidden = true;
  });
  query.addEventListener("blur", function () {
    window.setTimeout(function () {
      list.hidden = true;
      var hit = exact(query.value);
      if (hit) {
        choose(hit);
        return;
      }
      var selected = buttons.filter(function (button) { return button.dataset.id === hidden.value; })[0];
      query.value = selected ? selected.dataset.label : "";
      if (!selected) hidden.value = "";
    }, 150);
  });
  buttons.forEach(function (button) {
    button.addEventListener("mousedown", function (event) { event.preventDefault(); });
    button.addEventListener("touchend", function (event) {
      event.preventDefault();
      choose(button);
    });
    button.addEventListener("click", function () { choose(button); });
  });
  var form = root.closest("form");
  if (form) {
    form.addEventListener("submit", function () {
      var hit = exact(query.value);
      if (hit) choose(hit);
    });
  }
})();
</script>
</div>
