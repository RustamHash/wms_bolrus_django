{% load wms %}
<div data-measure>
  <label>Вид паллета
    <select name="pallet_type" required>
      <option value=""></option>
      {% for key, name in PALLET_TYPE.items %}
      <option value="{{ key }}" data-tare="{% pallet_tare key %}" {% if measure.pallet_type == key %}selected{% endif %}>{% pallet_label key %}</option>
      {% endfor %}
    </select>
  </label>
  <label>Упаковка
    <select name="packaging_id" required>
      <option value=""></option>
      {% for item in packagings %}
      <option value="{{ item.id }}" data-tare="{{ item.tare_kg }}" {% if measure.packaging_id == item.id %}selected{% endif %}>{{ item.name }} ({{ item.tare_kg|kg }} кг)</option>
      {% endfor %}
    </select>
  </label>
  <label>Упаковок <input name="places" inputmode="numeric" required value="{% if measure.places %}{{ measure.places }}{% endif %}"></label>
  <label>Грязный вес, кг <input name="gross" inputmode="decimal" required value="{% if measure.places %}{{ measure.gross|kg }}{% endif %}"></label>
  <label class="check" data-net-toggle><input type="checkbox" {% if measure.manual %}checked{% endif %}> Ввести чистый вес</label>
  <label>Чистый вес, кг <input name="net" inputmode="decimal" value="{% if measure.places %}{{ measure.net|kg }}{% endif %}" {% if not measure.manual %}disabled{% endif %}></label>
  <input type="hidden" name="net_manual" value="{% if measure.manual %}1{% else %}0{% endif %}">
  <p class="hint" data-net-hint>Чистый вес считается сам: грязный минус вес деревяшки и минус тара одной упаковки, умноженная на число упаковок. В остаток, движение и паспорт попадает чистый вес.</p>
</div>
<script>
(function () {
  var root = document.currentScript.parentElement;
  if (!root || root.dataset.bound) return;
  root.dataset.bound = "1";
  var form = root.closest("form");
  if (!form) return;
  var net = root.querySelector("[name=net]");
  var manual = root.querySelector("[name=net_manual]");
  var toggle = root.querySelector("[data-net-toggle] input");
  var places = root.querySelector("[name=places]");
  var gross = root.querySelector("[name=gross]");
  var packaging = root.querySelector("[name=packaging_id]");
  var palletType = root.querySelector("[name=pallet_type]");
  if (!net || !places || !gross) return;

  function readTare(select) {
    var option = select && select.options[select.selectedIndex];
    var raw = option && option.dataset.tare ? option.dataset.tare : "0";
    var value = Number(String(raw).replace(",", "."));
    return Number.isFinite(value) ? value : 0;
  }
  function canRecalc() {
    return palletType && palletType.value && packaging && packaging.value && places.value && gross.value;
  }
  function setManual(on) {
    if (manual) manual.value = on ? "1" : "0";
    net.disabled = !on;
    net.required = !!on;
  }
  function recalc() {
    if (manual && manual.value === "1") return;
    if (!canRecalc()) return;
    var grossValue = Number(String(gross.value).replace(",", "."));
    var count = Number(places.value);
    var value = grossValue - readTare(palletType) - readTare(packaging) * count;
    net.value = value > 0 ? value.toFixed(3).replace(".", ",") : "";
  }
  function refresh() {
    if (toggle && toggle.checked) return;
    setManual(false);
    recalc();
  }
  if (toggle) {
    toggle.addEventListener("change", function () {
      if (toggle.checked) setManual(true);
      else refresh();
    });
  }
  if (palletType) palletType.addEventListener("change", refresh);
  if (packaging) packaging.addEventListener("change", refresh);
  places.addEventListener("input", refresh);
  gross.addEventListener("input", refresh);

  var missing = form.querySelector("[data-missing]");
  function applyMissing() {
    var off = !!(missing && missing.checked);
    root.hidden = off;
    root.querySelectorAll("input, select").forEach(function (field) {
      if (off) {
        field.disabled = true;
        field.required = false;
        return;
      }
      if (field.name === "net_manual") {
        field.disabled = false;
        return;
      }
      if (field.name === "net") {
        setManual(!!(toggle && toggle.checked));
        return;
      }
      field.disabled = false;
      if (field.name === "places" || field.name === "gross" || field.name === "pallet_type" || field.name === "packaging_id") {
        field.required = true;
      }
    });
    if (!off) recalc();
  }
  if (missing) missing.addEventListener("change", applyMissing);
  if (missing && missing.checked) applyMissing();
  else if (toggle && toggle.checked) setManual(true);
  else refresh();
})();
</script>
